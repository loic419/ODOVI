<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --ink: #111111;
      --muted: #6d6d6a;
      --line: #e7e3dc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Archivo", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 24px;
    }

    h1.intro-heading {
      font-family: "Archivo", sans-serif;
      font-size: clamp(1.35rem, 2.3vw, 2.1rem);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: #141414;
      text-align: center;
      margin: 0 0 1.2rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    .intro {
      color: var(--muted);
      font-size: 0.96rem;
      margin-bottom: 24px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }
    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity .7s ease, transform .7s cubic-bezier(.16, 1, .3, 1);
      transition-delay: var(--reveal-delay, 0ms);
    }
    .reveal-on-scroll.is-visible {
      opacity: 1;
      transform: none;
    }
    .project {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
    }
    .project-art {
      aspect-ratio: 4 / 3;
      background: #f3f0ed;
      overflow: hidden;
    }
    .project-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .project-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 16px;
      border-top: 1px solid var(--line);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .project-meta strong {
      font-size: 1rem;
      letter-spacing: -0.02em;
      text-transform: none;
      color: var(--ink);
    }
    @media (max-width: 980px) {
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      .topbar { flex-direction: column; align-items: flex-start; }
      .gallery { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal-on-scroll,
      .reveal-on-scroll.is-visible {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="back-link" href="viper-portfolio.html#project">← Back</a>
    </div>

    <h1 class="intro-heading">Logo Maker</h1>
    <div class="intro">Complete gallery of logo designs and brand visuals. The collection will grow with new projects.</div>

    <div class="gallery">
      <article class="project">
        <div class="project-art"><img src="logo designer/Frame 3 (1).jpg" alt="Web Designer project 1" /></div>
        <div class="project-meta"><strong>Web Designer</strong><span>UI</span></div>
      </article>

      <article class="project">
        <div class="project-art"><img src="logo designer/Frame 5 (1).jpg" alt="Logo Designer project 2" /></div>
        <div class="project-meta"><strong>Logo Designer</strong><span>Brand</span></div>
      </article>

      <article class="project">
        <div class="project-art"><img src="logo designer/Frame 7.jpg" alt="Brand Designer project 3" /></div>
        <div class="project-meta"><strong>Brand Designer</strong><span>Identity</span></div>
      </article>

      <article class="project">
        <div class="project-art"><img src="logo designer/Frame 9.jpg" alt="Poster Designer project 4" /></div>
        <div class="project-meta"><strong>Poster Designer</strong><span>Print</span></div>
      </article>
    </div>
  </div>

  <script>
    const revealTargets = document.querySelectorAll('.topbar, .intro-heading, .intro, .project');

    if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const revealObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -36px' });

      revealTargets.forEach((element, index) => {
        element.classList.add('reveal-on-scroll');
        element.style.setProperty('--reveal-delay', `${Math.min(index, 3) * 90}ms`);
        revealObserver.observe(element);
      });
    } else {
      revealTargets.forEach(element => element.classList.add('is-visible'));
    }
  </script>
</body>
</html>
